[package]
name = "service-ingest-base"
version = "0.1.1"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.36", features = ["ring"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
pulsar = "6.6.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio-rustls","postgres","macros"]}
chrono = "0.4.43"
reqwest = { version = "0.13.1", features = ["json", "query"]  }
tokio-retry = "0.3.0"
async-trait = "0.1.89"
